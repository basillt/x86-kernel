name: tests

on:
  push:
  pull_request:

jobs:
  qemu-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm qemu-system-x86

      - name: Build kernel
        run: make

      - name: Run tests in QEMU
        run: python3 tests/run_tests.py --no-build
